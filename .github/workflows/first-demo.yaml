name: First Demo Action

on: 
 push:
  branches:
   - mamunBranch

jobs:
 demo-job:
  runs-on: ubuntu-latest

  steps:
   - run: echo "Hello from Mamun"
   - name: Checkout
     uses: actions/checkout@v4

   - name: Run a one-line script
     run: |
      echo "add a action to build"
      echo "test, build and deploy our project"

   - name: List files
     run: ls ${{ github.workspace }}

   - name: Print Github Context
     env: 
      GITHUB_CONTEXT: ${{ toJson(github) }}

     run: echo "$GITHUB_CONTEXT"

   - name: Action Complited
     run: echo "Action Complited!!"