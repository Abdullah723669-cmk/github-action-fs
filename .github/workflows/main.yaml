name: Full CI/CD Pipeline

on:
  push:
    branches:
      - mamunBranch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install

      - name: Lint and Test
        run: |
          yarn lint || true
          yarn test

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/github-action-fs:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/github-action-fs:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            bash ~/deploy.sh

      - name: ✅ Notify Success
        run: echo "🚀 Deployment successfullly-------NEON!"
