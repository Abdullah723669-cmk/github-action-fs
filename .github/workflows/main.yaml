name: Full CI/CD Pipeline

on:
  push:
    branches:
      - mamunBranch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install

      - name: Lint and Test
        run: |
          yarn lint || true
          yarn test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
                username: ${{ secrets.DOCKER_USERNAME}}
                password: ${{ secrets.DOCKER_PASSWORD}}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/github-action-fs:latest-1 .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/github-action-fs:latest-1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            bash ~/deploy.sh

      - name: ✅ Notify Success
        run: echo "🚀 Deployment successfullly---Faiza-- welcome Bangladesh!! MAMUN --NEON saheb --subaita! year :2025"
