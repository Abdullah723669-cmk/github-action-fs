name: Test Using Mocha

on: [push]

jobs:
    test: 
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js
              uses: actions/setup-node@v2
              with: 
                node-version: '18'
            - name: Install Dependencies   
              run: yarn install 
            - name: Run Test
              run: yarn test
            - run: echo "All Test Action Done"